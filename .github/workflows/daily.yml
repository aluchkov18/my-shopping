name: Дневни цени

on:
  schedule:
    # 09:40 UTC = 10:40 во Скопје зиме, 11:40 лете. Трговците ажурираат до 10:00.
    - cron: "40 9 * * *"
  workflow_dispatch:
    inputs:
      chains:
        description: "Само овие синџири (празно = сите), на пр. kam zito"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Читање на ценовниците
        env:
          CHAINS: ${{ github.event.inputs.chains }}
        run: python -m collector.run $CHAINS
      - name: Запис во репото
        if: always()
        run: |
          git config user.name "my-shopping-bot"
          git config user.email "my-shopping-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Цени $(TZ=Europe/Skopje date +%F)"
          git push
